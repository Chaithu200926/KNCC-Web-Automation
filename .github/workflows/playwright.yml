name: Playwright tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        type: choice
        options:
          - all
          - cinema-booking
        default: all

permissions:
  contents: read
  checks: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Test1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Test1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_PIN: ${{ secrets.TEST_PIN }}
          TEST_SUITE: ${{ inputs.suite || (github.event_name == 'push' && 'cinema-booking') || 'all' }}
        run: |
          if [ "$TEST_SUITE" = "cinema-booking" ]; then
            npx playwright test tests/cinescape-cinema-booking.spec.ts --retries=0
          else
            npm test
          fi

      - name: Generate visual dashboard
        if: always()
        run: npm run dashboard

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Playwright test results
          path: Test1/test-results/results.xml
          reporter: java-junit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Test1/playwright-report/
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload dashboard for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Test1/dashboard

  deploy-dashboard:
    if: github.event_name != 'pull_request' && needs.test.result == 'success'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
