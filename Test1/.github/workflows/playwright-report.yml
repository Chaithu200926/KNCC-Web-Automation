name: Playwright tests and report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: Test1

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Test1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Generate screenshot dashboard
        if: always()
        run: npm run dashboard

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: Test1/dashboard

      - name: Upload report and screenshots as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-and-screenshots
          path: |
            Test1/dashboard
            Test1/playwright-report
            Test1/test-results
          if-no-files-found: warn

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4